<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="flipbook1/favicon.png">
<link rel="apple-touch-icon" href="flipbook1/favicon.png"><title>Harlow's Accidental Journey — NOT FOR PRINT</title>
<style>
  html,body{margin:0;height:100%;background:#191919;color:#f4f1ea;font:15px/1.3 "Segoe UI",sans-serif}
  #viewer{position:relative;min-height:100%;height:100%;background:#191919;display:flex;flex-direction:column}
  #viewer:fullscreen,#viewer:-webkit-full-screen{width:100%;height:100%;background:#191919}
  #banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;background:#191919;z-index:2}
  #tools{display:flex;align-items:center;gap:12px}
  #counter{background:rgba(20,20,20,.55);color:#fff;border-radius:999px;padding:6px 12px;white-space:nowrap}
  #mark{white-space:nowrap}
  #fs,#pagesBtn{flex:0 0 auto;width:42px;height:42px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);color:#f4f1ea;border:1px solid rgba(244,241,234,.45);border-radius:50%;cursor:pointer;font:inherit}
  #fs svg{width:20px;height:20px;stroke:#f4f1ea;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block}
  #pagesBtn svg{width:19px;height:19px;fill:#f4f1ea;display:block}
  #stage{flex:1;width:100%;min-height:0;background:#373737;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  #bookWrap{position:relative;z-index:1}
  #book{position:relative;perspective:2300px}
  #book.single{overflow:hidden}
  .base{position:absolute;top:0;height:100%;z-index:1;background:#2b2b2b}
  .base img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  .base .grad{position:absolute;top:0;bottom:0;width:30px;z-index:2;pointer-events:none}
  #baseL .grad{right:0;background:linear-gradient(to left,rgba(0,0,0,.20),rgba(0,0,0,0))}
  #baseR .grad{left:0;background:linear-gradient(to right,rgba(0,0,0,.20),rgba(0,0,0,0))}
  .shade{position:absolute;top:0;height:100%;z-index:3;opacity:0;pointer-events:none}
  #shadeL{background:linear-gradient(to left,rgba(0,0,0,.55),rgba(0,0,0,0) 75%)}
  #shadeR{background:linear-gradient(to right,rgba(0,0,0,.55),rgba(0,0,0,0) 75%)}
  #leaf{position:absolute;top:0;height:100%;z-index:5;display:none;transform-origin:left center;transform-style:preserve-3d;will-change:transform}
  #leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#2b2b2b}
  #leaf .face img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  #leaf .face.back{transform:rotateY(180deg)}
  #leaf .fshade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:64px;height:96px;margin:0;padding:0;border:0;outline:0;box-shadow:none;background:transparent;color:#fff;font-size:52px;cursor:pointer;line-height:1;pointer-events:auto;appearance:none;-webkit-appearance:none}
  .arrow:hover,.arrow:focus,.arrow:focus-visible,.arrow:active{border:0;outline:0;box-shadow:none;background:transparent}
  #prev{left:8px}#next{right:8px}
  body.expanded #viewer{position:fixed;inset:0;height:100%;height:100dvh;z-index:50}
  body.expanded #banner{position:absolute;top:0;left:0;right:0;background:transparent;justify-content:flex-end}
  body.expanded #counter,body.expanded #mark{display:none}
  body.expanded #stage{height:100%}
  #viewer:fullscreen #banner{position:absolute;top:0;left:0;right:0;background:transparent;justify-content:flex-end;z-index:30}
  #viewer:fullscreen #counter,#viewer:fullscreen #mark{display:none}
  body.expanded #fs,body.expanded #pagesBtn,#viewer:fullscreen #fs,#viewer:fullscreen #pagesBtn{background:rgba(15,15,15,.5)}
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:rgba(16,16,16,.97);border-top:1px solid #4a4a4a;transform:translateY(105%);visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s}
  #sheet.open{transform:none;visibility:visible;transition:transform .3s ease}
  #sheetBar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0}
  #sheetTitle{font-weight:600;letter-spacing:.03em}
  #sheetClose{flex:0 0 auto;width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:#f4f1ea;border:1px solid rgba(244,241,234,.4);border-radius:50%;cursor:pointer}
  #sheetClose svg{width:15px;height:15px;stroke:#f4f1ea;fill:none;stroke-width:2.4;stroke-linecap:round;display:block}
  #strip{display:flex;gap:10px;overflow-x:auto;padding:10px 14px 16px;-webkit-overflow-scrolling:touch}
  .tcard{flex:0 0 auto;background:none;border:2px solid rgba(255,255,255,.14);border-radius:8px;padding:4px;cursor:pointer;font:inherit}
  .tcard .timgs{display:flex;gap:2px}
  .tcard img{height:82px;width:82px;object-fit:cover;display:block;border-radius:3px;background:#333}
  .tcard .tcap{display:block;color:#cfc9bd;font-size:11px;text-align:center;padding-top:4px}
  .tcard.now{border-color:#e8b34b}
  .tcard.now .tcap{color:#e8b34b}
  @media (max-width:560px){#banner{padding:10px 12px}#tools{gap:8px;flex-wrap:wrap;justify-content:flex-end}#mark{order:3;flex-basis:100%;text-align:right;font-size:12px;white-space:normal}#counter{padding:6px 10px}}
</style></head>
<body>
  <div id="viewer">
    <div id="banner"><span id="counter">Page 1 of 52</span><span id="tools"><strong id="mark">BookDesk-Mocks-Test-20261029-c · v2-pages — NOT FOR PRINT</strong><button id="pagesBtn" type="button" aria-label="Pages" title="Pages"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button><button id="fs" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg></button></span></div>
    <div id="stage">
      <button id="prev" class="arrow" type="button" aria-label="Previous">&#8249;</button>
      <button id="next" class="arrow" type="button" aria-label="Next">&#8250;</button>
      <div id="bookWrap"><div id="glide"><div id="book">
        <div class="base" id="baseL"><img alt=""><div class="grad"></div></div>
        <div class="base" id="baseR"><img alt=""><div class="grad"></div></div>
        <div class="shade" id="shadeL"></div>
        <div class="shade" id="shadeR"></div>
        <div id="leaf">
          <div class="face front"><img alt=""><div class="fshade"></div></div>
          <div class="face back"><img alt=""><div class="fshade"></div></div>
        </div>
      </div></div></div>
    </div>
    <div id="sheet" aria-hidden="true">
      <div id="sheetBar"><span id="sheetTitle">Pages — tap one to jump there</span><button id="sheetClose" type="button" aria-label="Close pages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div id="strip"></div>
    </div>
  </div>
  <script src="flipbook1/manifest.js"></script>
  <script>
  (function () {
    var PAGES = BOOK.pages, N = PAGES.length, HALF = N / 2;
    var viewer = document.getElementById("viewer");
    var stage = document.getElementById("stage");
    var bookEl = document.getElementById("book");
    var glideEl = document.getElementById("glide");
    var baseL = document.getElementById("baseL"), baseR = document.getElementById("baseR");
    var imgL = baseL.querySelector("img"), imgR = baseR.querySelector("img");
    var shadeL = document.getElementById("shadeL"), shadeR = document.getElementById("shadeR");
    var leaf = document.getElementById("leaf");
    var leafFrontImg = leaf.querySelector(".front img"), leafBackImg = leaf.querySelector(".back img");
    var leafShades = leaf.querySelectorAll(".fshade");
    var counter = document.getElementById("counter");
    var fsBtn = document.getElementById("fs");
    var sheet = document.getElementById("sheet");
    var strip = document.getElementById("strip");

    var single = false;       // portrait single-page mode
    var flipped = 0;          // spread state: leaves turned (0..HALF)
    var page = 0;             // single state: current page index
    var pageSize = 300;
    var animating = false;
    var FLIP_MS = 950;

    PAGES.forEach(function (src) { var im = new Image(); im.src = src; });

    function isSingle() { return stage.clientHeight > stage.clientWidth; }
    function easeInOutSine(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }
    function glideFor(f) { return f === 0 ? -pageSize / 2 : (f === HALF ? pageSize / 2 : 0); }

    function label() {
      if (single) return "Page " + (page + 1) + " of " + N;
      if (flipped === 0) return "Page 1 of " + N;
      if (flipped === HALF) return "Page " + N + " of " + N;
      return "Page " + (2 * flipped) + "–" + (2 * flipped + 1) + " of " + N;
    }

    function render() {
      if (single) {
        imgL.src = PAGES[page];
        baseL.style.display = "block";
        baseR.style.display = "none";
        glideEl.style.transform = "translateX(0px)";
      } else {
        var li = flipped === 0 ? null : 2 * flipped - 1;
        var ri = flipped === HALF ? null : 2 * flipped;
        if (li === null) { baseL.style.display = "none"; } else { baseL.style.display = "block"; imgL.src = PAGES[li]; }
        if (ri === null) { baseR.style.display = "none"; } else { baseR.style.display = "block"; imgR.src = PAGES[ri]; }
        glideEl.style.transform = "translateX(" + glideFor(flipped) + "px)";
      }
      counter.textContent = label();
    }

    function fit() {
      var nowSingle = isSingle();
      if (nowSingle !== single) {
        if (nowSingle) { page = flipped === 0 ? 0 : 2 * flipped - 1; }
        else { flipped = page === 0 ? 0 : (page % 2 === 0 ? page / 2 : (page + 1) / 2); }
        single = nowSingle;
      }
      var sw = stage.clientWidth, sh = stage.clientHeight;
      var pad = sw < 560 ? 10 : 24;
      if (single) pageSize = Math.max(80, Math.min(sw - pad * 2, sh - pad * 2));
      else pageSize = Math.max(80, Math.min((sw - pad * 2) / 2, sh - pad * 2));
      bookEl.style.width = (single ? pageSize : pageSize * 2) + "px";
      bookEl.style.height = pageSize + "px";
      bookEl.classList.toggle("single", single);
      baseL.style.left = "0px"; baseL.style.width = pageSize + "px";
      baseR.style.left = pageSize + "px"; baseR.style.width = pageSize + "px";
      shadeL.style.left = "0px"; shadeL.style.width = pageSize + "px";
      shadeR.style.left = (single ? 0 : pageSize) + "px"; shadeR.style.width = pageSize + "px";
      leaf.style.left = (single ? 0 : pageSize) + "px"; leaf.style.width = pageSize + "px";
      render();
    }

    function animateFlip(fromDeg, toDeg, glideFrom, glideTo, shadeMode, onDone) {
      animating = true;
      leaf.style.display = "block";
      var t0 = null;
      function frame(ts) {
        if (t0 === null) t0 = ts;
        var raw = Math.min(1, (ts - t0) / FLIP_MS);
        var e = easeInOutSine(raw);
        var ang = fromDeg + (toDeg - fromDeg) * e;
        leaf.style.transform = "rotateY(" + ang + "deg)";
        var s = Math.sin(Math.PI * raw);
        var fs = (s * 0.13).toFixed(3);
        leafShades[0].style.opacity = fs; leafShades[1].style.opacity = fs;
        if (shadeMode === "next") { shadeR.style.opacity = (s * 0.34).toFixed(3); shadeL.style.opacity = (s * 0.20).toFixed(3); }
        else { shadeL.style.opacity = (s * 0.34).toFixed(3); shadeR.style.opacity = (s * 0.20).toFixed(3); }
        if (glideFrom !== glideTo) glideEl.style.transform = "translateX(" + (glideFrom + (glideTo - glideFrom) * e) + "px)";
        if (raw < 1) { requestAnimationFrame(frame); return; }
        leaf.style.display = "none";
        leaf.style.transform = "";
        shadeL.style.opacity = 0; shadeR.style.opacity = 0;
        leafShades[0].style.opacity = 0; leafShades[1].style.opacity = 0;
        animating = false;
        onDone();
      }
      requestAnimationFrame(frame);
    }

    function flipNext() {
      if (animating) return;
      if (single) {
        if (page >= N - 1) return;
        imgL.src = PAGES[page + 1];
        leafFrontImg.src = PAGES[page]; leafBackImg.src = PAGES[page + 1];
        animateFlip(0, -180, 0, 0, "next", function () { page++; render(); });
      } else {
        if (flipped >= HALF) return;
        var f = flipped;
        leafFrontImg.src = PAGES[2 * f]; leafBackImg.src = PAGES[2 * f + 1];
        var nr = 2 * f + 2;
        if (nr < N) { baseR.style.display = "block"; imgR.src = PAGES[nr]; } else baseR.style.display = "none";
        animateFlip(0, -180, glideFor(f), glideFor(f + 1), "next", function () { flipped++; render(); });
      }
    }

    function flipPrev() {
      if (animating) return;
      if (single) {
        if (page <= 0) return;
        leafFrontImg.src = PAGES[page - 1]; leafBackImg.src = PAGES[page - 1];
        animateFlip(-180, 0, 0, 0, "prev", function () { page--; render(); });
      } else {
        if (flipped <= 0) return;
        var f = flipped;
        leafFrontImg.src = PAGES[2 * f - 2]; leafBackImg.src = PAGES[2 * f - 1];
        var pl = 2 * f - 3;
        if (pl >= 0) { baseL.style.display = "block"; imgL.src = PAGES[pl]; } else baseL.style.display = "none";
        animateFlip(-180, 0, glideFor(f), glideFor(f - 1), "prev", function () { flipped--; render(); });
      }
    }

    function goTo(firstIdx) {
      animating = false;
      leaf.style.display = "none";
      if (single) page = firstIdx;
      else flipped = firstIdx === 0 ? 0 : (firstIdx + 1) / 2;
      render();
    }

    document.getElementById("prev").onclick = function (e) { e.preventDefault(); e.stopPropagation(); flipPrev(); };
    document.getElementById("next").onclick = function (e) { e.preventDefault(); e.stopPropagation(); flipNext(); };
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && sheet.classList.contains("open")) { closeSheet(); return; }
      if (e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); flipPrev(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); flipNext(); }
    });

    var swipe = null;
    stage.addEventListener("pointerdown", function (e) {
      if (e.target.closest("button") || sheet.classList.contains("open")) { swipe = null; return; }
      swipe = { x: e.clientX, y: e.clientY };
    });
    stage.addEventListener("pointerup", function (e) {
      if (!swipe) return;
      var dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
      swipe = null;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) { if (dx < 0) flipNext(); else flipPrev(); }
    });

    /* ---- Pages sheet ---- */
    function pageGroups() {
      var out = [];
      if (single) { for (var i = 0; i < N; i++) out.push([i]); return out; }
      out.push([0]);
      for (var j = 1; j < N - 1; j += 2) out.push([j, j + 1]);
      if ((N - 1) % 2 === 1) out.push([N - 1]);
      return out;
    }
    function currentFirst() { return single ? page : (flipped === 0 ? 0 : 2 * flipped - 1); }
    function buildStrip() {
      var cur = currentFirst();
      strip.innerHTML = "";
      pageGroups().forEach(function (g) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tcard" + (g.indexOf(cur) >= 0 ? " now" : "");
        var imgs = g.map(function (ix) { return '<img loading="lazy" alt="" src="' + PAGES[ix] + '">'; }).join("");
        var cap = g.length === 2 ? (g[0] + 1) + "–" + (g[1] + 1) : "" + (g[0] + 1);
        b.innerHTML = '<span class="timgs">' + imgs + '</span><span class="tcap">' + cap + "</span>";
        b.setAttribute("aria-label", "Go to page " + cap);
        b.onclick = function () { closeSheet(); goTo(g[0]); };
        strip.appendChild(b);
      });
      var now = strip.querySelector(".tcard.now");
      if (now) strip.scrollLeft = Math.max(0, now.offsetLeft - strip.clientWidth / 2 + now.clientWidth / 2);
    }
    function openSheet() { buildStrip(); sheet.classList.add("open"); sheet.setAttribute("aria-hidden", "false"); }
    function closeSheet() { sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); }
    document.getElementById("pagesBtn").onclick = function () {
      if (sheet.classList.contains("open")) closeSheet(); else openSheet();
    };
    document.getElementById("sheetClose").onclick = closeSheet;

    /* ---- Fullscreen / expand (same behavior as flipbook3) ---- */
    var fsRequest = viewer.requestFullscreen || viewer.webkitRequestFullscreen;
    var fsElement = function () { return document.fullscreenElement || document.webkitFullscreenElement; };
    var ICON_OPEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>';
    var ICON_CLOSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    function fsShow(close, label) {
      fsBtn.innerHTML = close ? ICON_CLOSE : ICON_OPEN;
      fsBtn.setAttribute("aria-label", label);
      fsBtn.title = label;
    }
    function scheduleFit() { requestAnimationFrame(function () { requestAnimationFrame(fit); }); }
    function refit() { scheduleFit(); setTimeout(fit, 60); setTimeout(fit, 240); }
    function setExpanded(on) {
      document.body.classList.toggle("expanded", on);
      fsShow(on, on ? "Exit expanded view" : (fsRequest ? "Full screen" : "Expand view"));
      refit();
    }
    if (!fsRequest) fsShow(false, "Expand view");
    fsBtn.onclick = function () {
      if (document.body.classList.contains("expanded")) { setExpanded(false); return; }
      if (fsElement()) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        return;
      }
      if (fsRequest) {
        try {
          var p = fsRequest.call(viewer);
          if (p && p.catch) p.catch(function () { setExpanded(true); });
        } catch (err) { setExpanded(true); }
      } else setExpanded(true);
    };
    function onFsChange() {
      var inFs = !!fsElement();
      fsShow(inFs, inFs ? "Exit full screen" : (fsRequest ? "Full screen" : "Expand view"));
      refit();
    }
    document.addEventListener("fullscreenchange", onFsChange);
    document.addEventListener("webkitfullscreenchange", onFsChange);
    window.addEventListener("resize", function () {
      scheduleFit();
      if (sheet.classList.contains("open")) setTimeout(buildStrip, 260);
    });
    fit();
  })();
  </script>
</body></html>
