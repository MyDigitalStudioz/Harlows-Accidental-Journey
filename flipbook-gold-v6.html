<style>
  html,body{margin:0;height:100%;background:#191919;color:#f4f1ea;font:15px/1.3 "Segoe UI",sans-serif}
  #viewer{position:relative;min-height:100%;height:100%;background:#191919;display:flex;flex-direction:column}
  #viewer:fullscreen,#viewer:-webkit-full-screen{width:100%;height:100%;background:#191919}
  #banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;background:#191919;z-index:2}
  #tools{display:flex;align-items:center;gap:12px}
  #counter{background:rgba(20,20,20,.55);color:#fff;border-radius:999px;padding:6px 12px;white-space:nowrap}
  #mark{white-space:nowrap}
  #notice{display:none;position:absolute;left:12px;right:12px;bottom:12px;z-index:8;background:rgba(20,20,20,.88);color:#f4f1ea;border-radius:10px;padding:8px 12px;font-size:13px;pointer-events:none}
  #folderPop{position:absolute;top:62px;right:18px;z-index:9;display:flex;flex-direction:column;gap:10px;background:#242424;color:#f4f1ea;border:1px solid rgba(244,241,234,.35);border-radius:12px;padding:12px 14px;font-size:14px}
  #folderPop[hidden]{display:none}
  #folderPop label{display:flex;align-items:center;gap:8px}
  #folderGo,#pdfGo{background:#e8b34b;color:#191919;border:0;border-radius:999px;padding:8px 12px;font:inherit;cursor:pointer}
  #pdfBtn{flex:0 0 auto;height:42px;padding:0 14px;background:rgba(255,255,255,.07);color:#f4f1ea;border:1px solid rgba(244,241,234,.45);border-radius:999px;cursor:pointer;font:inherit;white-space:nowrap}
  #pdfPop{position:absolute;top:62px;right:18px;z-index:9;display:flex;flex-direction:column;gap:10px;background:#242424;color:#f4f1ea;border:1px solid rgba(244,241,234,.35);border-radius:12px;padding:12px 14px;font-size:14px}
  #pdfPop[hidden]{display:none}
  #pdfPop label{display:flex;align-items:center;gap:8px}
  #pdfLayout{background:#191919;color:#f4f1ea;border:1px solid rgba(244,241,234,.45);border-radius:8px;padding:4px 8px;font:inherit}
  #loadBar{position:absolute;left:0;right:0;top:0;height:3px;z-index:7;background:transparent}
  #loadBar[hidden]{display:none}
  #loadFill{height:100%;width:0;background:#e8b34b}
  #turnLabel{display:flex;align-items:center;gap:6px;color:#f4f1ea;font-size:13px;white-space:nowrap}
  #turnPick{background:#242424;color:#f4f1ea;border:1px solid rgba(244,241,234,.45);border-radius:999px;padding:6px 10px;font:inherit;cursor:pointer}
  #fs,#pagesBtn,#folderBtn,#guidesBtn{flex:0 0 auto;width:42px;height:42px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);color:#f4f1ea;border:1px solid rgba(244,241,234,.45);border-radius:50%;cursor:pointer;font:inherit}
  #fs svg{width:20px;height:20px;stroke:#f4f1ea;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block}
  #pagesBtn svg,#folderBtn svg{width:19px;height:19px;fill:#f4f1ea;display:block}
  #guidesBtn svg{width:19px;height:19px;stroke:#f4f1ea;fill:none;stroke-width:1.8;display:block}
  #guidesBtn[aria-pressed="true"]{border-color:#e8b34b;background:rgba(232,179,75,.22)}
  .guide{position:absolute;top:0;height:100%;z-index:9;pointer-events:none;display:none}
  body.guides-on .guide{display:block}
  .guide .gBleed{position:absolute;inset:0;border:2px solid rgba(63,169,245,.9)}
  .guide .gTrim{position:absolute;border:2px solid rgba(255,83,71,.95)}
  .guide .gSafe{position:absolute;border:2px dashed rgba(176,110,232,.95)}
  .guide .gtag{position:absolute;top:2px;left:2px;font-size:9px;font-weight:700;letter-spacing:.06em;padding:1px 4px;border-radius:3px;color:#fff}
  .guide .gtagT{background:#ff5347}
  .guide .gtagS{background:#b06ee8}
  #stage{flex:1;width:100%;min-height:0;background:#373737;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  #bookWrap{position:relative;z-index:1;cursor:grab;touch-action:none;will-change:transform}
  #bookWrap.grabbing{cursor:grabbing}
  #book{position:relative;perspective:2300px}
  #book.single{overflow:hidden}
  .base{position:absolute;top:0;height:100%;z-index:1;background:#2b2b2b;box-shadow:0 24px 55px rgba(0,0,0,.5)}
  .base img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  .shade{position:absolute;top:0;height:100%;z-index:3;opacity:0;pointer-events:none}
  #shadeL{background:linear-gradient(to left,rgba(0,0,0,.55),rgba(0,0,0,0) 75%)}
  #shadeR{background:linear-gradient(to right,rgba(0,0,0,.55),rgba(0,0,0,0) 75%)}
  #gl{position:absolute;z-index:5;display:none;pointer-events:none}
  #leafFB{position:absolute;top:0;height:100%;z-index:5;display:none;transform-origin:left center;transform-style:preserve-3d;will-change:transform}
  #leafFB .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#2b2b2b}
  #leafFB .face img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  #leafFB .face.back{transform:rotateY(180deg)}
  #leafFB .fshade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
  /* 5, not 8: this gutter wash must sit under the magazine sheet (#flipLayer is 6). 8 painted it across the turning leaf. It still covers the hardcover leaf because #gl and #leafFB are 5 and come first in the DOM. */
  #spineShade{position:absolute;top:0;height:100%;z-index:5;pointer-events:none;background:linear-gradient(to right,rgba(0,0,0,0) 0%,rgba(0,0,0,.16) 38%,rgba(0,0,0,.30) 50%,rgba(0,0,0,.16) 62%,rgba(0,0,0,0) 100%)}
  #castShade{position:absolute;top:0;height:100%;z-index:4;pointer-events:none;opacity:0;background:linear-gradient(to right,rgba(0,0,0,0) 0%,rgba(0,0,0,.85) 50%,rgba(0,0,0,0) 100%)}
  #botLayer{position:absolute;top:0;height:100%;z-index:4;display:none;pointer-events:none;background:#2b2b2b}
  #botLayer img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  #flipLayer{position:absolute;z-index:6;display:none;pointer-events:none;background:#2b2b2b;will-change:transform,clip-path}
  #flipLayer img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  #shadeCv{position:absolute;left:0;top:0;z-index:7;display:none;pointer-events:none}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:64px;height:96px;margin:0;padding:0;border:0;outline:0;box-shadow:none;background:transparent;color:#fff;font-size:52px;cursor:pointer;line-height:1;pointer-events:auto;appearance:none;-webkit-appearance:none}

  #prev{left:8px}#next{right:8px}
  body.expanded #viewer{position:fixed;inset:0;height:100%;height:100dvh;z-index:50}
  body.expanded #banner{position:absolute;top:0;left:0;right:0;background:transparent;justify-content:flex-end}
  body.expanded #counter,body.expanded #mark{display:none}
  body.expanded #stage{height:100%}
  #viewer:fullscreen #banner{position:absolute;top:0;left:0;right:0;background:transparent;justify-content:flex-end;z-index:30}
  #viewer:fullscreen #counter,#viewer:fullscreen #mark{display:none}
  body.expanded #fs,body.expanded #pagesBtn,#viewer:fullscreen #fs,#viewer:fullscreen #pagesBtn{background:rgba(15,15,15,.5)}
  body.expanded #turnLabel,#viewer:fullscreen #turnLabel{background:rgba(15,15,15,.55);border-radius:999px;padding:4px 8px}
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:rgba(16,16,16,.97);border-top:1px solid #4a4a4a;transform:translateY(105%);visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s}
  #sheet.open{transform:none;visibility:visible;transition:transform .3s ease}
  #sheetBar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0}
  #sheetTitle{font-weight:600;letter-spacing:.03em}
  #sheetClose{flex:0 0 auto;width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:#f4f1ea;border:1px solid rgba(244,241,234,.4);border-radius:50%;cursor:pointer}
  #sheetClose svg{width:15px;height:15px;stroke:#f4f1ea;fill:none;stroke-width:2.4;stroke-linecap:round;display:block}
  #strip{display:flex;gap:10px;overflow-x:auto;padding:10px 14px 16px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#4d4d4d #101010;cursor:grab}

  #strip::-webkit-scrollbar{height:10px}
  #strip::-webkit-scrollbar-track{background:#101010}
  #strip::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:6px;border:2px solid #101010}
  #strip::-webkit-scrollbar-thumb:hover{background:#666}
  .tcard{flex:0 0 auto;background:none;border:2px solid rgba(255,255,255,.14);border-radius:8px;padding:4px;cursor:pointer;font:inherit}
  .tcard .timgs{display:flex;gap:2px}
  .tcard img{height:82px;width:82px;object-fit:cover;display:block;border-radius:3px;background:#333}
  .tcard .tcap{display:block;color:#cfc9bd;font-size:11px;text-align:center;padding-top:4px}
  .tcard.now{border-color:#e8b34b}
  .tcard.now .tcap{color:#e8b34b}
  @media (max-width:560px){#banner{padding:10px 12px}#tools{gap:8px;flex-wrap:wrap;justify-content:flex-end}#mark{order:3;flex-basis:100%;text-align:right;font-size:12px;white-space:normal}#counter{padding:6px 10px}}

  <script src="flipbook-gold-v6/manifest.js"></script>
  <!-- pdf.js 3.11.174 (Apache-2.0), classic scripts. The worker script is loaded on purpose so file:// uses the main-thread fake worker. -->
  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script src="vendor/pdfjs/pdf.worker.min.js"></script>
  <script>
  function startFlipbook() {
    var PAGES = BOOK.pages, N = PAGES.length, HALF = N / 2;
    function pageSrc(src) {
      if (typeof PAGE_DATA !== "undefined" && PAGE_DATA && PAGE_DATA[src]) return PAGE_DATA[src];
      return src;
    }
    var viewer = document.getElementById("viewer");
    var stage = document.getElementById("stage");
    var bookWrap = document.getElementById("bookWrap");
    var bookEl = document.getElementById("book");
    var glideEl = document.getElementById("glide");
    var baseL = document.getElementById("baseL"), baseR = document.getElementById("baseR");
    var imgL = baseL.querySelector("img"), imgR = baseR.querySelector("img");

    /* ---- Print guides (Lulu spec, locked 2026-10-31) ----
       PAGE_SPEC.basis says what the loaded page images ARE:
         "bleed" = full 8.75in page (8.5 trim + 0.125 bleed all around)
         "trim"  = already cropped to the 8.5in trim
       Guide insets are computed from the spec, so if a book's images turn
       out to be trim-cropped, flipping basis to "trim" keeps the lines
       true — change nothing else. (BEST-3 measurement pending from Cursor;
       see CURSOR-NOTES-flipbook-v3-and-dimensions-2026-10-31.) */
    // Basis set from Cursor's measurement (2026-10-31): the built-in book's
    // images (and BEST-3's) are TrimBox crops — the 8.5in trim, no bleed in
    // the picture — so basis is "trim". Flip to "bleed" only for an image
    // set rendered WITH bleed (e.g. a future flipbook1750 set).
    var PAGE_SPEC = { trimIn: 8.5, bleedIn: 0.125, safetyIn: 0.5, basis: "trim" };
    var guideL = document.getElementById("guideL"), guideR = document.getElementById("guideR");
    function paintGuides() {
      var full = PAGE_SPEC.basis === "bleed" ? PAGE_SPEC.trimIn + 2 * PAGE_SPEC.bleedIn : PAGE_SPEC.trimIn;
      var trimInset = PAGE_SPEC.basis === "bleed" ? PAGE_SPEC.bleedIn : 0;
      var trimPct = 100 * trimInset / full, safePct = 100 * (trimInset + PAGE_SPEC.safetyIn) / full;
      [guideL, guideR].forEach(function (g) {
        var t = g.querySelector(".gTrim"), s = g.querySelector(".gSafe");
        // Trim-basis images contain no bleed — the blue bleed outline would
        // sit exactly on the trim line and lie about what the edge is.
        g.querySelector(".gBleed").style.display = PAGE_SPEC.basis === "bleed" ? "" : "none";
        t.style.left = t.style.right = t.style.top = t.style.bottom = trimPct + "%";
        s.style.left = s.style.right = s.style.top = s.style.bottom = safePct + "%";
      });
    }
    var shadeL = document.getElementById("shadeL"), shadeR = document.getElementById("shadeR");
    var canvas = document.getElementById("gl");
    var leafFB = document.getElementById("leafFB");
    var fbFrontImg = leafFB.querySelector(".front img"), fbBackImg = leafFB.querySelector(".back img");
    var fbShades = leafFB.querySelectorAll(".fshade");
    var botLayer = document.getElementById("botLayer");
    var flipLayer = document.getElementById("flipLayer");
    var botImg = botLayer.querySelector("img");
    var flipImg = flipLayer.querySelector("img");
    var shadeCv = document.getElementById("shadeCv");
    var shadeCtx = shadeCv.getContext("2d");
    var turnMode = "hardcover";
    try { if (localStorage.getItem("flipbook18-page-turn") === "magazine") turnMode = "magazine"; } catch (err) {}
    function isMag() { return turnMode === "magazine"; }
    var spineShade = document.getElementById("spineShade");
    var castShade = document.getElementById("castShade");
    var counter = document.getElementById("counter");
    var fsBtn = document.getElementById("fs");
    var sheet = document.getElementById("sheet");
    var strip = document.getElementById("strip");

    function newPageImg(src) {
      var im = new Image();
      var resolved = pageSrc(src);
      // CORS-mode loads keep the WebGL texture canvas untainted when the
      // page images are served from a different host than the page itself
      // (preview lenses, embeds): without this, texImage2D throws a
      // SecurityError and the 3D turn disables itself. http(s) file URLs
      // only — data URIs and file:// keep the plain load. Embedded pages
      // are what makes a turn land already decoded.
      if (/^https?:$/.test(location.protocol) && resolved.slice(0, 5) !== "data:") im.crossOrigin = "anonymous";
      im.src = resolved;
      return im;
    }
    var pageImgs = PAGES.map(newPageImg);
    var noticeEl = document.getElementById("notice");
    function reportNotice(text) {
      noticeEl.textContent = text;
      noticeEl.style.display = "block";
    }

    /* ================= WebGL leaf ================= */
    var M = 24;                                  // strip columns (shared vertices = no seams)
    var FLEX_RAD = 24 * Math.PI / 180;           // total tip lag at mid-turn
    var PERSP = 2300;
    var gl = null, glOK = false;
    var gProg, gPosBuf, gUvBuf, gIdxBuf, gTexF = null, gTexB = null;
    var uHalf, uWin, uP, uShadeL, uBendL, aPosL, aUvL;
    var winW = 0, winH = 0;                      // canvas window size in CSS px
    (function initGL() {
      try {
        gl = canvas.getContext("webgl", { antialias: true, alpha: true, depth: false, stencil: false, premultipliedAlpha: false });
        if (!gl) return;
        var vs = "attribute vec3 aPos; attribute vec2 aUv; uniform vec2 uHalf; uniform vec2 uWin; uniform float uP; varying vec2 vUv;" +
          "void main(){ float X = aPos.x - uHalf.x; float Y = aPos.y - uHalf.y; float d = uP - aPos.z;" +
          " float px = X * uP / d; float py = Y * uP / d;" +
          " gl_Position = vec4(px / uWin.x, -py / uWin.y, 0.0, 1.0); vUv = aUv; }";
        var fs = "precision mediump float; varying vec2 vUv; uniform sampler2D uFront; uniform sampler2D uBack; uniform float uShade; uniform float uBend;" +
          "void main(){ vec4 c; if (gl_FrontFacing) { c = texture2D(uFront, vUv); } else { c = texture2D(uBack, vec2(1.0 - vUv.x, vUv.y)); }" +
          " c.rgb *= (1.0 - uShade); c.rgb += uBend * 0.05 * smoothstep(0.93, 1.0, vUv.x); gl_FragColor = vec4(c.rgb, 1.0); }";
        function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
        gProg = gl.createProgram();
        gl.attachShader(gProg, sh(gl.VERTEX_SHADER, vs));
        gl.attachShader(gProg, sh(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(gProg);
        if (!gl.getProgramParameter(gProg, gl.LINK_STATUS)) { gl = null; return; }
        gl.useProgram(gProg);
        aPosL = gl.getAttribLocation(gProg, "aPos");
        aUvL = gl.getAttribLocation(gProg, "aUv");
        uHalf = gl.getUniformLocation(gProg, "uHalf");
        uWin = gl.getUniformLocation(gProg, "uWin");
        uP = gl.getUniformLocation(gProg, "uP");
        uShadeL = gl.getUniformLocation(gProg, "uShade");
        uBendL = gl.getUniformLocation(gProg, "uBend");
        gl.uniform1i(gl.getUniformLocation(gProg, "uFront"), 0);
        gl.uniform1i(gl.getUniformLocation(gProg, "uBack"), 1);
        // static uv + index buffers
        var uv = new Float32Array((M + 1) * 2 * 2);
        var idx = [];
        for (var i = 0; i <= M; i++) {
          uv[(i * 2) * 2] = i / M; uv[(i * 2) * 2 + 1] = 1;
          uv[(i * 2 + 1) * 2] = i / M; uv[(i * 2 + 1) * 2 + 1] = 0;
          if (i < M) { var a = i * 2, b = a + 1, c = a + 2, d = a + 3; idx.push(a, b, c, b, d, c); }
        }
        gUvBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, gUvBuf);
        gl.bufferData(gl.ARRAY_BUFFER, uv, gl.STATIC_DRAW);
        gIdxBuf = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gIdxBuf);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
        gPosBuf = gl.createBuffer();
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.CULL_FACE);
        glOK = true;
      } catch (e) { gl = null; glOK = false; }
    })();

    // The sheet's texture is pre-scaled to 1024x1024 (power of two) through

    blankCtx.fillRect(0, 0, 8, 8);
    var BLANK = blankCanvas.toDataURL("image/jpeg", 0.8);
    var folderBtn = document.getElementById("folderBtn");
    var folderPop = document.getElementById("folderPop");
    var folderPick = document.getElementById("folderPick");
    var loadBar = document.getElementById("loadBar");
    var loadFill = document.getElementById("loadFill");
    var folderGen = 0;
    var pdfGen = 0;
    var livePdf = null;
    var pdfName = "";
    var tempBlank = false;
    var coverOpened = false;
    var markEl = document.getElementById("mark");
    var markHome = markEl.textContent;
    var pdfBtn = document.getElementById("pdfBtn");
    var pdfPop = document.getElementById("pdfPop");
    var pdfPick = document.getElementById("pdfPick");
    folderBtn.onclick = function () { pdfPop.hidden = true; folderPop.hidden = !folderPop.hidden; };
    pdfBtn.onclick = function () { folderPop.hidden = true; pdfPop.hidden = !pdfPop.hidden; };
    document.getElementById("pdfGo").onclick = function () { pdfPick.click(); };
    pdfPick.onchange = function () {
      pdfPop.hidden = true;
      if (pdfPick.files && pdfPick.files[0]) takePdf(pdfPick.files[0]);
      pdfPick.value = "";
    };
    document.getElementById("pdfPrint").addEventListener("change", function () {
      if (!pdfName) return;
      markEl.textContent = document.getElementById("pdfPrint").checked ? pdfName + " — NOT FOR PRINT" : pdfName;
    });
    document.getElementById("folderGo").onclick = function () { folderPick.click(); };
    folderPick.onchange = function () {
      folderPop.hidden = true;
      if (folderPick.files && folderPick.files.length) takeFiles(folderPick.files);
      folderPick.value = "";
    };
    viewer.addEventListener("dragover", function (e) { e.preventDefault(); });
    viewer.addEventListener("drop", function (e) {
      e.preventDefault();
      folderPop.hidden = true;
      pdfPop.hidden = true;
      var items = e.dataTransfer && e.dataTransfer.items;
      var incoming = (!items || !items.length)
        ? Promise.resolve([].slice.call(e.dataTransfer.files || []))
        : Promise.all([].map.call(items, readDropItem)).then(function (groups) {
          var flat = [];
          groups.forEach(function (g) { flat = flat.concat(g); });
          return flat;
        });
      incoming.then(function (flat) {
        var pdf = null;
        for (var i = 0; i < flat.length; i++) if (isPdfFile(flat[i])) { pdf = flat[i]; break; }
        if (pdf) takePdf(pdf);
        else takeFiles(flat);
      });
    });
    function readDropItem(item) {
      return new Promise(function (resolve) {
        var entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
        if (!entry) { var one = item.getAsFile && item.getAsFile(); resolve(one ? [one] : []); return; }
        if (entry.isFile) { entry.file(function (f) { resolve([f]); }, function () { resolve([]); }); return; }
        var reader = entry.createReader();
        var all = [];
        function batch() {
          reader.readEntries(function (entries) {
            if (!entries.length) { resolve(all); return; }
            var pending = entries.length;
            entries.forEach(function (ent) {
              if (!ent.isFile) { if (--pending === 0) batch(); return; }
              ent.file(function (f) { all.push(f); if (--pending === 0) batch(); }, function () { if (--pending === 0) batch(); });
            });
          }, function () { resolve(all); });
        }
        batch();
      });
    }
    function isPageFile(file) {
      var name = (file.name || "").toLowerCase();
      if (name === "thumbs.db" || name === ".ds_store" || name === "desktop.ini") return false;
      var rel = file.webkitRelativePath || "";
      if (rel && rel.split("/").length > 2) return false;
      return /\.(jpe?g|png|webp)$/.test(name);
    }
    function firstNumber(name) { var m = String(name).match(/\d+/); return m ? parseInt(m[0], 10) : null; }
    function sortFiles(files) {
      return files.slice().sort(function (a, b) {
        var na = firstNumber(a.name), nb = firstNumber(b.name);
        if (na !== null && nb !== null && na !== nb) return na - nb;
        if (na !== null && nb === null) return -1;
        if (na === null && nb !== null) return 1;
        return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
      });
    }
    function gapWarnings(files) {
      var seen = {}, dups = {}, nums = [];
      files.forEach(function (f) {
        var n = firstNumber(f.name);
        if (n === null) return;
        if (seen[n]) dups[n] = true;
        seen[n] = true;
        nums.push(n);
      });
      nums.sort(function (a, b) { return a - b; });
      var missing = [];
      if (nums.length) {
        for (var n = nums[0]; n < nums[nums.length - 1]; n++) if (!seen[n]) missing.push(n);
      }
      var out = [];
      var start = null, prev = null;
      function flush() {
        if (start === null) return;
        out.push(start === prev ? "No page " + start + " found." : "No pages " + start + "–" + prev + " found.");
        start = prev = null;
      }
      missing.forEach(function (n) {
        if (start === null) { start = prev = n; return; }
        if (n === prev + 1) { prev = n; return; }
        flush();
        start = prev = n;
      });
      flush();
      Object.keys(dups).forEach(function (n) { out.push("Two files numbered " + n + "."); });
      return out;
    }
    function paintSlice(im, sx, sy, sw, sh) {
      var maxSide = 1600;
      var scale = Math.min(1, maxSide / Math.max(sw, sh));
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(sw * scale));
      c.height = Math.max(1, Math.round(sh * scale));
      c.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", 0.85);
    }
    function fileToPages(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onerror = function () { reject(new Error("read")); };
        reader.onload = function () {
          var im = new Image();
          im.onload = function () {
            var w = im.naturalWidth, h = im.naturalHeight;
            if (w / h >= 1.45) resolve([paintSlice(im, 0, 0, w / 2, h), paintSlice(im, w / 2, 0, w / 2, h)]);
            else resolve([paintSlice(im, 0, 0, w, h)]);
          };
          im.onerror = function () { reject(new Error("image")); };
          im.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
    function pushPage(src) {
      PAGES.push(src);
      pageImgs.push(newPageImg(src));
    }
    function dropTempBlank() {
      if (!tempBlank) return;
      PAGES.pop();
      pageImgs.pop();
      tempBlank = false;
    }
    function ensureEven() {
      if (PAGES.length % 2 === 0) return;
      pushPage(BLANK);
      tempBlank = true;
    }
    function showBook(reset, coverOn) {
      N = PAGES.length;
      HALF = N / 2;
      if (!coverOn && !coverOpened && flipped === 0 && N >= 4) { flipped = 1; focus = 0; coverOpened = true; }
      if (reset) {
        flipped = (!coverOn && N >= 4) ? 1 : 0;
        focus = 0;
        animating = false;
        hideLeaf();
        render();
        fit();
      } else if (animating) pendingBook = true;
      else {
        if (flipped > HALF) flipped = HALF;
        render();
      }
      if (sheet.classList.contains("open")) buildStrip();
    }
    function isPdfFile(file) {
      var name = (file.name || "").toLowerCase();
      return file.type === "application/pdf" || /\.pdf$/.test(name);
    }
    function stopPdf() {
      pdfGen++;
      if (livePdf) { try { livePdf.destroy(); } catch (err) {} livePdf = null; }
    }
    function paintPdf(page, layout) {
      var base = page.getViewport({ scale: 1 });
      var split = layout === "spreads" ? true : layout === "single" ? false : (base.width / base.height) >= 1.45;
      var longTarget = 1600;
      var scale = split
        ? longTarget / Math.max(base.width / 2, base.height)
        : longTarget / Math.max(base.width, base.height);
      var vp = page.getViewport({ scale: scale });
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(vp.width));
      canvas.height = Math.max(1, Math.round(vp.height));
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
        if (!split) return [canvas.toDataURL("image/jpeg", 0.92)];
        var w = Math.floor(canvas.width / 2);
        function half(x) {
          var c = document.createElement("canvas");
          c.width = w;
          c.height = canvas.height;
          c.getContext("2d").drawImage(canvas, x, 0, w, canvas.height, 0, 0, w, canvas.height);
          return c.toDataURL("image/jpeg", 0.92);
        }
        return [half(0), half(w)];
      });
    }
    function takePdf(file) {
      var gen = ++pdfGen;
      folderGen++;
      if (livePdf) { try { livePdf.destroy(); } catch (err) {} livePdf = null; }
      pdfName = file.name || "PDF";
      markEl.textContent = document.getElementById("pdfPrint").checked ? pdfName + " — NOT FOR PRINT" : pdfName;
      var layout = document.getElementById("pdfLayout").value;
      var coverOn = document.getElementById("pdfCover").checked;
      var reader = new FileReader();
      reader.onerror = function () { if (gen === pdfGen) reportNotice("Could not read that PDF."); };
      reader.onload = function () {
        if (gen !== pdfGen || typeof pdfjsLib === "undefined") return;
        var data = new Uint8Array(reader.result);
        pdfjsLib.getDocument({ data: data, useSystemFonts: true }).promise.then(function (doc) {
          if (gen !== pdfGen) { doc.destroy(); return; }
          livePdf = doc;
          blankNote = "";
          tempBlank = false;
          coverOpened = false;
          PAGES = [];
          pageImgs = [];
          if (!coverOn) pushPage(BLANK);
          var opened = false;
          var total = doc.numPages;
          loadBar.hidden = false;
          loadFill.style.width = "0%";
          function finish() {
            if (gen !== pdfGen) return;
            dropTempBlank();
            if (PAGES.length % 2) { pushPage(BLANK); blankNote = "blank page added"; }
            showBook(!opened, coverOn);
            loadBar.hidden = true;
            if (!PAGES.length) reportNotice("That PDF has no pages.");
            else { noticeEl.textContent = ""; noticeEl.style.display = "none"; }
          }
          function step(n) {
            if (gen !== pdfGen) return;
            if (n > total) { finish(); return; }
            reportNotice("Loading page " + n + " of " + total);
            doc.getPage(n).then(function (page) {
              return paintPdf(page, layout);
            }).then(function (parts) {
              if (gen !== pdfGen) return;
              dropTempBlank();
              parts.forEach(pushPage);
              ensureEven();
              showBook(!opened, coverOn);
              opened = true;
              loadFill.style.width = Math.round((n / total) * 100) + "%";
              step(n + 1);
            }).catch(function () {
              if (gen !== pdfGen) return;
              reportNotice("Could not read page " + n + " of " + pdfName + ".");
              step(n + 1);
            });
          }
          step(1);
        }).catch(function () {
          if (gen === pdfGen) reportNotice("Could not open " + pdfName + ".");
        });
      };
      reader.readAsArrayBuffer(file);
    }
    function takeFiles(fileList) {
      var gen = ++folderGen;
      stopPdf();
      pdfName = "";
      markEl.textContent = markHome;
      var files = [];
      for (var i = 0; i < fileList.length; i++) if (isPageFile(fileList[i])) files.push(fileList[i]);
      if (!files.length) { reportNotice("No page images in that folder."); return; }
      files = sortFiles(files);
      var warnings = gapWarnings(files);
      var coverOn = document.getElementById("coverFirst").checked;
      blankNote = "";
      tempBlank = false;
      coverOpened = false;
      PAGES = [];
      pageImgs = [];
      if (!coverOn) pushPage(BLANK);
      var opened = false;
      loadBar.hidden = false;
      loadFill.style.width = "0%";
      function say() {
        var parts = warnings.slice();
        if (blankNote) parts.push("A blank page was added so the last opening has a facing page.");
        if (parts.length) reportNotice(parts.join(" "));
        else { noticeEl.textContent = ""; noticeEl.style.display = "none"; }
      }
      function step(i) {
        if (gen !== folderGen) return;
        if (i >= files.length) {
          dropTempBlank();
          if (PAGES.length % 2) { pushPage(BLANK); blankNote = "blank page added"; }
          showBook(!opened, coverOn);
          opened = true;
          loadBar.hidden = true;
          say();
          return;
        }
        fileToPages(files[i]).then(function (parts) {
          if (gen !== folderGen) return;
          dropTempBlank();
          parts.forEach(pushPage);
          ensureEven();
          showBook(!opened, coverOn);
          opened = true;
          loadFill.style.width = Math.round(((i + 1) / files.length) * 100) + "%";
          step(i + 1);
        }).catch(function () {
          warnings.push("Could not read " + files[i].name + ".");
          step(i + 1);
        });
      }
      step(0);
    }

    var turnPick = document.getElementById("turnPick");
    turnPick.value = turnMode;
    turnPick.addEventListener("change", function () {
      var mode = turnPick.value === "magazine" ? "magazine" : "hardcover";
      var spread = flipped;
      turnGen++;
      animating = false;
      pendingDir = null;
      drag = null;
      bookWrap.classList.remove("grabbing");
      hideLeaf();
      turnMode = mode;
      flipped = spread;
      try { localStorage.setItem("flipbook18-page-turn", mode); } catch (err) {}
      render();
    });

    fit();
    document.body.dataset.flipReady = "1";
  }
  // Embedded pages first, on every protocol. file:// used to be the only

  var dataScript = document.createElement("script");
  dataScript.src = "flipbook-gold-v6/pages-data.js";
  dataScript.onload = function () { startFlipbook(); };
  dataScript.onerror = function () { startFlipbook(); };
