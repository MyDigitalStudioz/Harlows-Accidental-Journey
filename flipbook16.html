<style>

  <script src="flipbook1/manifest.js"></script>
  <script>
  (function () {
    var PAGES = BOOK.pages, N = PAGES.length, HALF = N / 2;
    var viewer = document.getElementById("viewer");
    var stage = document.getElementById("stage");
    var bookWrap = document.getElementById("bookWrap");
    var bookEl = document.getElementById("book");
    var glideEl = document.getElementById("glide");
    var baseL = document.getElementById("baseL"), baseR = document.getElementById("baseR");
    var imgL = baseL.querySelector("img"), imgR = baseR.querySelector("img");
    var shadeL = document.getElementById("shadeL"), shadeR = document.getElementById("shadeR");
    var botLayer = document.getElementById("botLayer");
    var botImg = botLayer.querySelector("img");
    var flipLayer = document.getElementById("flipLayer");
    var flipImg = flipLayer.querySelector("img");
    var shadeCv = document.getElementById("shadeCv");
    var shadeCtx = shadeCv.getContext("2d");
    var spineShade = document.getElementById("spineShade");
    var counter = document.getElementById("counter");
    var fsBtn = document.getElementById("fs");
    var sheet = document.getElementById("sheet");
    var strip = document.getElementById("strip");


    /* ================= corner-fold leaf (StPageFlip geometry) =================
       The turning sheet is a rigid plane pivoting on whichever spine
       corner the flip point F rides: bottom for button/tap flips and
       bottom-half drags, top for top-half drags — exactly StPageFlip's
       Calc, unit-verified against the live library's own outputs for
       both corners. The visible sheet region is the plane clipped
       against the original page rect; the page beneath shows in the
       complementary clip. Coordinates: spine frame — x from the spine
       toward the turning side, y down. */
    function limitToCircle(c, R, p) {
      var dx = c.x - p.x, dy = c.y - p.y;
      if (Math.sqrt(dx * dx + dy * dy) <= R) return p;
      var ax = Math.sqrt(R * R * dx * dx / (dx * dx + dy * dy)) + c.x;
      if (p.x < 0) ax *= -1;
      var ay = (ax - c.x) * dy / dx + c.y;
      if (dx + c.y === 0) ay = R;
      return { x: ax, y: ay };
    }
    function calcFold(F0, corner, W, H) {
      var F = { x: F0.x, y: F0.y }, rect = null, A = 0, valid = true;
      function geom(p) {
        var e = W - p.x + 1;
        var i = corner === "bottom" ? H - p.y : p.y;
        var s0 = 2 * Math.acos(Math.max(-1, Math.min(1, e / Math.sqrt(i * i + e * e))));
        if (!isFinite(s0) || (Math.PI - s0 >= 0 && Math.PI - s0 < 0.003)) { valid = false; return; }
        var sg = i < 0 ? -s0 : s0;
        A = corner === "bottom" ? -sg : sg;
        var base = corner === "top"
          ? [{ x: 0, y: 0 }, { x: W, y: 0 }, { x: 0, y: H }, { x: W, y: H }]
          : [{ x: 0, y: -H }, { x: W, y: -H }, { x: 0, y: 0 }, { x: W, y: 0 }];
        var c = Math.cos(A), sn = Math.sin(A);
        function rot(b) { return { x: b.x * c + b.y * sn + p.x, y: b.y * c - b.x * sn + p.y }; }
        rect = { tl: rot(base[0]), tr: rot(base[1]), bl: rot(base[2]), br: rot(base[3]) };
      }
      geom(F);
      if (!valid) return { valid: false };
      var cPt = corner === "top" ? { x: 0, y: 0 } : { x: 0, y: H };
      var oPt = corner === "top" ? { x: 0, y: H } : { x: 0, y: 0 };
      var n1 = limitToCircle(cPt, W, F);
      if (n1.x !== F.x || n1.y !== F.y) { F = n1; geom(F); if (!valid) return { valid: false }; }
      var rr = Math.sqrt(W * W + H * H);
      var o = rect.br, a = rect.tl;
      if (corner === "bottom") { o = rect.tr; a = rect.bl; }
      if (o.x <= 0) {
        var n2 = limitToCircle(oPt, rr, a);
        if (n2.x !== F.x || n2.y !== F.y) { F = n2; geom(F); if (!valid) return { valid: false }; }
      }
      function lineI(p1, p2, p3, p4) {
        var d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
        if (!d) return null;
        var t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
        var x = p1.x + t * (p2.x - p1.x), y = p1.y + t * (p2.y - p1.y);
        return (x >= -1 && x <= W + 1 && y >= -1 && y <= H + 1) ? { x: x, y: y } : null;
      }
      var topI = corner === "top" ? lineI(F, rect.tr, { x: 0, y: 0 }, { x: W, y: 0 }) : lineI(rect.tl, rect.tr, { x: 0, y: 0 }, { x: W, y: 0 });
      var sideI = corner === "top" ? lineI(F, rect.bl, { x: W, y: 0 }, { x: W, y: H }) : lineI(F, rect.tl, { x: W, y: 0 }, { x: W, y: H });
      var botI = lineI(rect.bl, rect.br, { x: 0, y: H }, { x: W, y: H });
      var flipClip = [rect.tl], flag = false;
      if (topI) flipClip.push(topI);
      if (!sideI) flag = true; else { flipClip.push(sideI); if (!botI) flag = false; }
      if (botI) flipClip.push(botI);
      if (flag || corner === "bottom") flipClip.push(rect.bl);
      function pdist(p, q) { return (!p || !q) ? Infinity : Math.sqrt((p.x - q.x) * (p.x - q.x) + (p.y - q.y) * (p.y - q.y)); }
      var botClip = [];
      if (topI) botClip.push(topI);
      if (corner === "top") botClip.push({ x: W, y: 0 });
      else { if (topI) botClip.push({ x: W, y: 0 }); botClip.push({ x: W, y: H }); }
      if (sideI) { if (pdist(sideI, topI) >= 10) botClip.push(sideI); }
      else if (corner === "top") botClip.push({ x: W, y: H });
      if (botI) botClip.push(botI);
      if (topI) botClip.push(topI);
      var shadowStart = corner === "top" ? topI : (sideI || topI);
      var shadowEnd = shadowStart === topI ? (sideI || botI) : botI;
      return { valid: true, F: F, A: A, rect: rect, flipClip: flipClip, botClip: botClip,
               shadowStart: shadowStart, shadowEnd: shadowEnd,
               progress: Math.abs((F.x - W) / (2 * W)) };
    }
    var MAX_SHADOW_OPACITY = 0.22;
    /* =============== end corner-fold leaf =============== */

    var focusMode = false;
    var flipped = 0;
    var focus = 0;
    var pageSize = 300;
    var camX = 0, camAnim = null;
    var animating = false;
    var pendingDir = null;   // one-deep queue: a tap mid-flip lines up the next turn
    var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    var FLIP_MS = REDUCED ? 320 : 700;

    function isSingle() { return stage.clientHeight > stage.clientWidth; }
    function easeInOutSine(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }
    function glideFor(f) { return focusMode ? 0 : (f === 0 ? -pageSize / 2 : (f === HALF ? pageSize / 2 : 0)); }

    /* ---- camera: in focus (portrait) mode the spread stays whole and the
       view slides to frame one page at a time, like the Santa viewer ---- */
    function setCam(x) { camX = x; bookWrap.style.transform = "translateX(" + x + "px)"; }
    function camTargetFor(fx, foc) {
      if (!focusMode) return 0;
      if (fx === 0) return -pageSize / 2;
      if (fx === HALF) return pageSize / 2;
      return foc === 0 ? pageSize / 2 : -pageSize / 2;
    }
    function tweenCam(to, dur, easeFn) {
      if (camAnim) cancelAnimationFrame(camAnim);
      var from = camX, t0 = null; dur = dur || 500;
      function fr(ts) {
        if (t0 === null) t0 = ts;
        var raw = Math.min(1, (ts - t0) / dur);
        var e = easeFn ? easeFn(raw) : Math.sin(raw * Math.PI / 2);
        setCam(from + (to - from) * e);
        if (raw < 1) camAnim = requestAnimationFrame(fr); else camAnim = null;
      }
      camAnim = requestAnimationFrame(fr);
    }
    function slideTo(side) {
      focus = side;
      tweenCam(camTargetFor(flipped, side), REDUCED ? 180 : 500);
      counter.textContent = label();
    }

    function label() {
      if (focusMode) {
        if (flipped === 0) return "Page 1 of " + N;
        if (flipped === HALF) return "Page " + N + " of " + N;
        return "Page " + (focus === 0 ? 2 * flipped : 2 * flipped + 1) + " of " + N;
      }
      if (flipped === 0) return "Page 1 of " + N;
      if (flipped === HALF) return "Page " + N + " of " + N;
      return "Page " + (2 * flipped) + "–" + (2 * flipped + 1) + " of " + N;
    }

    function render() {
      var li = flipped === 0 ? null : 2 * flipped - 1;
      var ri = flipped === HALF ? null : 2 * flipped;
      if (li === null) { baseL.style.display = "none"; } else { baseL.style.display = "block"; imgL.src = PAGES[li]; }
      if (ri === null) { baseR.style.display = "none"; } else { baseR.style.display = "block"; imgR.src = PAGES[ri]; }
      // While a leaf is flying, poseLeaf owns the glide (it interpolates to
      // exactly this value on the final frame). Setting it here mid-flight
      // would slam the book sideways at the swap, then step it back.
      if (!animating) glideEl.style.transform = "translateX(" + glideFor(flipped) + "px)";
      counter.textContent = label();
    }

    function fit() {
      var nowFocus = isSingle();
      if (nowFocus !== focusMode) {
        focusMode = nowFocus;
        if (focusMode) focus = 0;   // entering portrait: frame the left page first
      }
      var sw = stage.clientWidth, sh = stage.clientHeight;
      var pad = sw < 560 ? 10 : 24;
      if (focusMode) pageSize = Math.max(80, Math.min(sw - pad * 2, sh - pad * 2));
      else pageSize = Math.max(80, Math.min((sw - pad * 2) / 2, sh - pad * 2));
      var bookW = pageSize * 2;
      bookEl.style.width = bookW + "px";
      bookEl.style.height = pageSize + "px";
      baseL.style.left = "0px"; baseL.style.width = pageSize + "px";
      baseR.style.left = pageSize + "px"; baseR.style.width = pageSize + "px";
      shadeL.style.left = "0px"; shadeL.style.width = pageSize + "px";
      shadeR.style.left = pageSize + "px"; shadeR.style.width = pageSize + "px";
      spineShade.style.display = "block";
      spineShade.style.left = (pageSize - 36) + "px";
      spineShade.style.width = "72px";
      botLayer.style.width = pageSize + "px";
      flipLayer.style.width = pageSize + "px";
      flipLayer.style.height = pageSize + "px";
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      shadeCv.style.width = bookW + "px";
      shadeCv.style.height = pageSize + "px";
      shadeCv.width = Math.round(bookW * dpr);
      shadeCv.height = Math.round(pageSize * dpr);
      shadeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null; }
      setCam(camTargetFor(flipped, focus));
      render();
    }

    var turnDir = null;      // "next" | "prev" while the turn layers are live
    var turnCorner = "bottom";
    var lastPoseP = 0;
    function showTurn() {
      botLayer.style.display = "block";
      flipLayer.style.display = "block";
      flipLayer.style.opacity = "";
      shadeCv.style.display = "block";
    }
    function hideTurn() {
      botLayer.style.display = "none";
      flipLayer.style.display = "none";
      flipLayer.style.opacity = "";
      flipLayer.style.transform = "";
      flipLayer.style.clipPath = "";
      shadeCv.style.display = "none";
      shadeL.style.opacity = 0; shadeR.style.opacity = 0;
      turnDir = null;
    }

    function toBook(q) {  // spine frame -> book coords for the active turn side
      return turnDir === "next" ? { x: pageSize + q.x, y: q.y } : { x: pageSize - q.x, y: q.y };
    }
    function polyStr(pts) {
      return "polygon(" + pts.map(function (q) { return q.x.toFixed(1) + "px " + q.y.toFixed(1) + "px"; }).join(", ") + ")";
    }

    /* Pose the turning sheet at flip point F (spine frame, x toward the
       turning side). glideNow interpolates the book-centering glide. */
    function poseTurn(F, glideNow) {
      var W = pageSize, H = pageSize;
      var c = calcFold(F, turnCorner, W, H);
      if (!c.valid) return lastPoseP;
      var p = c.progress;
      lastPoseP = p;
      // --- the sheet (destination-side image on the rotating plane) ---
      // Affine-map the element onto the calc rect in book coords. For
      // "prev" the image corners swap left/right (the library's direction
      // flip), which keeps the content reading correctly mid-turn.
      var B = function (q) { return toBook(q); };
      var q00, q10, q01;
      if (turnDir === "next") { q00 = B(c.rect.tl); q10 = B(c.rect.tr); q01 = B(c.rect.bl); }
      else { q00 = B(c.rect.tr); q10 = B(c.rect.tl); q01 = B(c.rect.br); }
      var ma = (q10.x - q00.x) / W, mb = (q10.y - q00.y) / W;
      var mc = (q01.x - q00.x) / H, md = (q01.y - q00.y) / H;
      flipLayer.style.left = "0px";
      flipLayer.style.top = "0px";
      flipLayer.style.transformOrigin = "0 0";
      flipLayer.style.transform = "matrix(" + ma.toFixed(5) + ", " + mb.toFixed(5) + ", " + mc.toFixed(5) + ", " + md.toFixed(5) + ", " + q00.x.toFixed(1) + ", " + q00.y.toFixed(1) + ")";
      var det = ma * md - mb * mc;
      flipLayer.style.clipPath = polyStr(c.flipClip.map(function (q) {
        var qb = B(q), vx = qb.x - q00.x, vy = qb.y - q00.y;
        return { x: (md * vx - mc * vy) / det, y: (-mb * vx + ma * vy) / det };
      }));
      // --- the page beneath, clipped to the vacated region (element-local) ---
      botLayer.style.clipPath = polyStr(c.botClip.map(function (q) {
        return turnDir === "next" ? { x: q.x, y: q.y } : { x: pageSize - q.x, y: q.y };
      }));
      // --- crease shadows on the overlay canvas ---
      var ctx = shadeCtx;
      ctx.clearRect(0, 0, W * 2, H);
      if (c.shadowStart && c.shadowEnd) {
        var s0 = toBook(c.shadowStart), s1 = toBook(c.shadowEnd);
        var ddx = s1.x - s0.x, ddy = s1.y - s0.y;
        var len = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
        var ux = ddx / len, uy = ddy / len;
        // outward normal: from the sheet's centroid toward the crease,
        // i.e. into the vacated region — robust for both corners/sides
        var fcx = 0, fcy = 0;
        c.flipClip.forEach(function (q) { var b = toBook(q); fcx += b.x; fcy += b.y; });
        fcx /= c.flipClip.length; fcy /= c.flipClip.length;
        var mx = (s0.x + s1.x) / 2 - fcx, my = (s0.y + s1.y) / 2 - fcy;
        var ml = Math.sqrt(mx * mx + my * my) || 1;
        var nx = mx / ml, ny = my / ml;
        var sw = 0.75 * W * p;                                   // shadow width (theirs: 3/4 page * progress)
        var op = MAX_SHADOW_OPACITY * (1 - p) + 0.04 * Math.sin(Math.PI * p);
        var ext = H * 1.3;
        function band(sign, width, stops) {
          var ax = s0.x - ux * ext, ay = s0.y - uy * ext;
          var bx = s1.x + ux * ext, by = s1.y + uy * ext;
          var g = ctx.createLinearGradient(ax, ay, ax + nx * sign * width, ay + ny * sign * width);
          stops.forEach(function (st) { g.addColorStop(st[0], "rgba(0,0,0," + (st[1]).toFixed(3) + ")"); });
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
          ctx.lineTo(bx + nx * sign * width, by + ny * sign * width);
          ctx.lineTo(ax + nx * sign * width, ay + ny * sign * width);
          ctx.closePath(); ctx.fill();
        }
        if (sw > 1 && len > 4) {
          band(1, sw, [[0, op], [1, 0]]);                        // cast shadow on the revealed page
          ctx.save();
          ctx.beginPath();
          c.flipClip.forEach(function (q, ix) { var b = toBook(q); if (ix === 0) ctx.moveTo(b.x, b.y); else ctx.lineTo(b.x, b.y); });
          ctx.closePath(); ctx.clip();
          band(-1, sw * 0.75, [[0, op], [0.15, 0.05], [0.35, op], [1, 0]]);  // fold shading on the sheet
          ctx.restore();
        }
      }
      var s = Math.sin(Math.PI * p);
      if (turnDir === "next") { shadeR.style.opacity = (s * 0.34).toFixed(3); shadeL.style.opacity = (s * 0.20).toFixed(3); }
      else { shadeL.style.opacity = (s * 0.34).toFixed(3); shadeR.style.opacity = (s * 0.20).toFixed(3); }
      if (glideNow !== null && glideNow !== undefined) glideEl.style.transform = "translateX(" + glideNow + "px)";
      return p;
    }

    /* Set up the turn layers. dir: "next" | "prev". The flat base on the
       turning side keeps the sheet's front; the page that will be revealed
       goes on the clipped bottom layer; the sheet's back rides the plane. */
    function setupTurn(dir, corner) {
      turnDir = dir;
      turnCorner = corner || "bottom";
      lastPoseP = 0;
      if (dir === "next") {
        if (flipped >= HALF) return false;
        var f = flipped;
        flipImg.src = PAGES[2 * f + 1];
        var nr = 2 * f + 2;
        botLayer.style.left = pageSize + "px";
        if (nr < N) { botImg.src = PAGES[nr]; botLayer.style.visibility = "visible"; }
        else botLayer.style.visibility = "hidden";
      } else {
        if (flipped <= 0) return false;
        var g = flipped;
        flipImg.src = PAGES[2 * g - 2];
        var pl = 2 * g - 3;
        botLayer.style.left = "0px";
        if (pl >= 0) { botImg.src = PAGES[pl]; botLayer.style.visibility = "visible"; }
        else botLayer.style.visibility = "hidden";
      }
      showTurn();
      poseTurn(turnStartF(turnCorner), glideFor(flipped));
      return true;
    }
    // the library's own flip points: the corner rides the page edge,
    // 10px in from the outer side, 2px off the top/bottom edge
    function turnStartF(corner) { return corner === "top" ? { x: pageSize - 10, y: 2 } : { x: pageSize - 10, y: pageSize - 2 }; }
    function turnEndF(corner) { return corner === "top" ? { x: -pageSize, y: 2 } : { x: -pageSize, y: pageSize - 2 }; }

    function commitTurn(dir) {
      flipped += (dir === "next" ? 1 : -1);
    }

    function stateAfter(dir) { return flipped + (dir === "next" ? 1 : -1); }

    var SWAP_P = 0.93;   // landing crossfade: progress where the base swaps under the sheet
    function animateTurnF(dir, F0, F1, g0, g1, dur, onSwap, onDone) {
      animating = true;
      showTurn();
      var t0 = null, swapped = false;
      function frame(ts) {
        if (t0 === null) t0 = ts;
        var raw = Math.min(1, (ts - t0) / dur);
        var F = { x: F0.x + (F1.x - F0.x) * raw, y: F0.y + (F1.y - F0.y) * raw };
        var p = poseTurn(F, g0 + (g1 - g0) * raw);
        // Landing handoff: past SWAP_P, swap the flat bases in UNDER the
        // still-turning sheet, then fade the sheet out over the remaining
        // travel so the two renderings blend instead of snapping.
        if (!swapped && p >= SWAP_P) {
          swapped = true;
          if (onSwap) onSwap();
        }
        if (swapped) flipLayer.style.opacity = Math.pow(Math.max(0, (1 - p) / (1 - SWAP_P)), 0.65).toFixed(3);
        if (raw < 1) { requestAnimationFrame(frame); return; }
        hideTurn();
        animating = false;
        if (onDone) onDone();
        if (pendingDir) {
          var pd = pendingDir;
          pendingDir = null;
          if (pd === "next") flipNext(); else flipPrev();
        }
      }
      requestAnimationFrame(frame);
    }

    function flipNext() {
      if (drag) return;
      if (animating) { pendingDir = "next"; return; }
      if (focusMode && flipped > 0 && flipped < HALF && focus === 0) { slideTo(1); return; }
      if (!setupTurn("next")) return;
      var g0 = glideFor(flipped), g1 = glideFor(flipped + 1);
      tweenCam(camTargetFor(flipped + 1, 0), FLIP_MS, function (t) { return t; });
      animateTurnF("next", turnStartF("bottom"), turnEndF("bottom"), g0, g1, FLIP_MS, function () { commitTurn("next"); focus = 0; render(); }, null);
    }

    function flipPrev() {
      if (drag) return;
      if (animating) { pendingDir = "prev"; return; }
      if (focusMode && flipped > 0 && flipped < HALF && focus === 1) { slideTo(0); return; }
      if (!setupTurn("prev")) return;
      var g0 = glideFor(flipped), g1 = glideFor(flipped - 1);
      tweenCam(camTargetFor(flipped - 1, 1), FLIP_MS, function (t) { return t; });
      animateTurnF("prev", turnStartF("bottom"), turnEndF("bottom"), g0, g1, FLIP_MS, function () { commitTurn("prev"); focus = 1; render(); }, null);
    }

    function goTo(firstIdx) {
      animating = false;
      pendingDir = null;
      hideTurn();
      if (focusMode) {
        var p = firstIdx;
        if (p <= 0) { flipped = 0; focus = 0; }
        else if (p >= N - 1) { flipped = HALF; focus = 1; }
        else { flipped = (p + 1) >> 1; focus = (p % 2 === 1) ? 0 : 1; }
        if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null; }
        setCam(camTargetFor(flipped, focus));
      } else {
        flipped = firstIdx === 0 ? 0 : (firstIdx + 1) / 2;
      }
      render();
    }

    document.getElementById("prev").onclick = function (e) { e.preventDefault(); e.stopPropagation(); flipPrev(); };
    document.getElementById("next").onclick = function (e) { e.preventDefault(); e.stopPropagation(); flipNext(); };
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && sheet.classList.contains("open")) { closeSheet(); return; }
      if (e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); flipPrev(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); flipNext(); }
      else if (e.key === "Home") { e.preventDefault(); goTo(0); }
      else if (e.key === "End") { e.preventDefault(); goTo(N - 1); }
    });

    /* ---- drag the page ---- */
    var drag = null;
    function dragF(d, clientX, clientY) {
      var r = bookEl.getBoundingClientRect();
      var spineX = r.left + pageSize;
      var u = d.dir === "next" ? (clientX - spineX) : (spineX - clientX);
      u = Math.max(-pageSize, Math.min(pageSize, u));
      var v = Math.max(-pageSize, Math.min(2 * pageSize, clientY - r.top));
      return { x: u, y: v };
    }
    function grabCorner(clientY) {
      var r = bookEl.getBoundingClientRect();
      return (clientY - r.top) < pageSize / 2 ? "top" : "bottom";
    }
    bookWrap.addEventListener("pointerdown", function (e) {
      if (drag) return;
      if (e.target.closest("button") || sheet.classList.contains("open")) return;
      // During a flip a press can't peel, but it can still be a tap (the
      // flip functions queue it). tapOnly drags never activate.
      drag = { x0: e.clientX, y0: e.clientY, dx: 0, dir: null, corner: "bottom", active: false, tapOnly: animating, t0: performance.now(), id: e.pointerId, samples: [{ t: performance.now(), dx: 0 }] };
      try { bookWrap.setPointerCapture(e.pointerId); } catch (err) {}
    });
    bookWrap.addEventListener("pointermove", function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      drag.dx = e.clientX - drag.x0;
      if (drag.tapOnly) return;
      drag.samples.push({ t: performance.now(), dx: drag.dx });
      if (drag.samples.length > 12) drag.samples.shift();
      if (!drag.active) {
        if (Math.abs(drag.dx) < 8) return;
        if (focusMode) {
          var intent = drag.dx < 0 ? "next" : "prev";
          var canSlide = flipped > 0 && flipped < HALF &&
            ((intent === "next" && focus === 0) || (intent === "prev" && focus === 1));
          if (canSlide) {
            if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null; }
            drag.kind = "slide";
            drag.slideTarget = intent === "next" ? 1 : 0;
            drag.camFrom = camX;
            drag.camTo = camTargetFor(flipped, drag.slideTarget);
            drag.active = true;
            bookWrap.classList.add("grabbing");
          } else {
            drag.corner = grabCorner(drag.y0);
            if (!setupTurn(intent, drag.corner)) { drag = null; return; }
            drag.kind = "flip";
            drag.dir = intent;
            drag.active = true;
            drag.g0 = glideFor(flipped);
            drag.g1 = glideFor(stateAfter(intent));
            bookWrap.classList.add("grabbing");
          }
        } else {
          var dir;
          var r = bookEl.getBoundingClientRect();
          var spineX = r.left + pageSize;
          if (e.clientX - drag.dx < spineX) dir = "prev"; else dir = "next";
          if ((dir === "next" && flipped >= HALF) || (dir === "prev" && flipped <= 0)) dir = drag.dx < 0 ? "next" : "prev";
          drag.corner = grabCorner(drag.y0);
          if (!setupTurn(dir, drag.corner)) { drag = null; return; }
          drag.kind = "flip";
          drag.dir = dir;
          drag.active = true;
          drag.g0 = glideFor(flipped);
          drag.g1 = glideFor(stateAfter(dir));
          bookWrap.classList.add("grabbing");
        }
      }
      if (drag.kind === "slide") {
        var lo = Math.min(drag.camFrom, drag.camTo), hi = Math.max(drag.camFrom, drag.camTo);
        setCam(Math.max(lo, Math.min(hi, drag.camFrom + drag.dx)));
        return;
      }
      var F = dragF(drag, e.clientX, e.clientY);
      drag.F = F;
      var pNow = poseTurn(F, null);
      drag.p = pNow;
      glideEl.style.transform = "translateX(" + (drag.g0 + (drag.g1 - drag.g0) * pNow) + "px)";
    });
    function endDrag(cancelled) {
      if (!drag) return;
      var d = drag; drag = null;
      bookWrap.classList.remove("grabbing");
      if (!d.active) {
        // A press that never became a peel is a tap: flip by side, like the
        // original viewer. In focus mode a tap simply advances.
        if (!cancelled && Math.abs(d.dx) < 8 && performance.now() - d.t0 <= 800) {
          if (focusMode) flipNext();
          else {
            var r = bookEl.getBoundingClientRect();
            if (d.x0 < r.left + pageSize) flipPrev(); else flipNext();
          }
        }
        return;
      }
      var now = performance.now(), vel = 0, s0 = d.samples[0];
      for (var i = d.samples.length - 1; i >= 0; i--) {
        if (now - d.samples[i].t > 90) { s0 = d.samples[i]; break; }
      }
      if (s0 && now > s0.t) vel = (d.dx - s0.dx) / (now - s0.t);
      if (d.kind === "slide") {
        var prog = Math.abs(camX - d.camFrom) / pageSize;
        var sflick = d.slideTarget === 1 ? vel < -0.45 : vel > 0.45;
        if (prog > 0.4 || sflick) {
          focus = d.slideTarget;
          tweenCam(d.camTo, REDUCED ? 120 : 260);
          counter.textContent = label();
        } else {
          tweenCam(d.camFrom, REDUCED ? 120 : 260);
        }
        return;
      }
      var Fcur = d.F || turnStartF(d.corner);
      var flick = d.dir === "next" ? vel < -0.45 : vel > 0.45;
      // Complete when the corner is pulled across the spine by a real drag
      // (or dragged most of the way, or flicked) — a short nudge springs
      // back even if it started near the spine.
      var progF = (pageSize - Fcur.x) / (2 * pageSize);
      var complete = flick || progF >= 0.78 || (Fcur.x <= 0 && Math.abs(d.dx) >= 40);
      var target = complete ? turnEndF(d.corner) : turnStartF(d.corner);
      var dur = Math.max(120, FLIP_MS * Math.abs(target.x - Fcur.x) / (2 * pageSize));
      var gNow = parseFloat((glideEl.style.transform || "").replace(/[^0-9.\-]/g, "")) || 0;
      var gEnd = complete ? d.g1 : d.g0;
      var landFocus = d.dir === "next" ? 0 : 1;
      if (complete) tweenCam(camTargetFor(stateAfter(d.dir), landFocus), dur, function (t) { return t; });
      animateTurnF(d.dir, Fcur, target, gNow, gEnd, dur, function () {
        if (complete) { commitTurn(d.dir); focus = landFocus; }
        render();
      }, null);
    }
    bookWrap.addEventListener("pointerup", function () { endDrag(false); });
    bookWrap.addEventListener("pointercancel", function () { endDrag(true); });

    /* ---- Pages sheet ---- */
    function pageGroups() {
      var out = [];
      if (focusMode) { for (var i = 0; i < N; i++) out.push([i]); return out; }
      out.push([0]);
      for (var j = 1; j < N - 1; j += 2) out.push([j, j + 1]);
      if ((N - 1) % 2 === 1) out.push([N - 1]);
      return out;
    }
    function currentFirst() {
      if (focusMode) {
        if (flipped === 0) return 0;
        if (flipped === HALF) return N - 1;
        return focus === 0 ? 2 * flipped - 1 : 2 * flipped;
      }
      return flipped === 0 ? 0 : 2 * flipped - 1;
    }
    function buildStrip() {
      var cur = currentFirst();
      strip.innerHTML = "";
      pageGroups().forEach(function (g) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tcard" + (g.indexOf(cur) >= 0 ? " now" : "");
        var imgs = g.map(function (ix) { return '<img loading="lazy" alt="" src="' + PAGES[ix] + '">'; }).join("");
        var cap = g.length === 2 ? (g[0] + 1) + "–" + (g[1] + 1) : "" + (g[0] + 1);
        b.innerHTML = '<span class="timgs">' + imgs + '</span><span class="tcap">' + cap + "</span>";
        b.setAttribute("aria-label", "Go to page " + cap);
        b.onclick = function () { closeSheet(); goTo(g[0]); };
        strip.appendChild(b);
      });
      var now = strip.querySelector(".tcard.now");
      if (now) strip.scrollLeft = Math.max(0, now.offsetLeft - strip.clientWidth / 2 + now.clientWidth / 2);
    }
    function openSheet() { buildStrip(); sheet.classList.add("open"); sheet.setAttribute("aria-hidden", "false"); }
    function closeSheet() { sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); }
    document.getElementById("pagesBtn").onclick = function () {
      if (sheet.classList.contains("open")) closeSheet(); else openSheet();
    };
    document.getElementById("sheetClose").onclick = closeSheet;

    /* ---- Fullscreen / expand (same behavior as flipbook5) ---- */
    var fsRequest = viewer.requestFullscreen || viewer.webkitRequestFullscreen;
    var fsElement = function () { return document.fullscreenElement || document.webkitFullscreenElement; };
    var ICON_OPEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>';
    var ICON_CLOSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    function fsShow(close, label) {
      fsBtn.innerHTML = close ? ICON_CLOSE : ICON_OPEN;
      fsBtn.setAttribute("aria-label", label);
      fsBtn.title = label;
    }
    function scheduleFit() { requestAnimationFrame(function () { requestAnimationFrame(fit); }); }
    function refit() { scheduleFit(); setTimeout(fit, 60); setTimeout(fit, 240); }
    function setExpanded(on) {
      document.body.classList.toggle("expanded", on);
      fsShow(on, on ? "Exit expanded view" : (fsRequest ? "Full screen" : "Expand view"));
      refit();
    }
    if (!fsRequest) fsShow(false, "Expand view");
    fsBtn.onclick = function () {
      if (document.body.classList.contains("expanded")) { setExpanded(false); return; }
      if (fsElement()) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        return;
      }
      if (fsRequest) {
        try {
          var p = fsRequest.call(viewer);
          if (p && p.catch) p.catch(function () { setExpanded(true); });
        } catch (err) { setExpanded(true); }
      } else setExpanded(true);
    };
    function onFsChange() {
      var inFs = !!fsElement();
      fsShow(inFs, inFs ? "Exit full screen" : (fsRequest ? "Full screen" : "Expand view"));
      refit();
    }
    document.addEventListener("fullscreenchange", onFsChange);
    document.addEventListener("webkitfullscreenchange", onFsChange);
    window.addEventListener("resize", function () {
      scheduleFit();
      if (sheet.classList.contains("open")) setTimeout(buildStrip, 260);
    });
    fit();
  })();
  </script>
</body></html>
